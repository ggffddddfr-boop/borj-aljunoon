name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir -p www
          cp "$(ls game_v*.html | sort -V | tail -1)" www/index.html
      - run: |
          bash "$(ls setup*.sh | sort -V | tail -1)"
      - run: |
          if ls *.keystore >/dev/null 2>&1; then
            mkdir -p ~/.android
            cp "$(ls *.keystore | head -1)" ~/.android/debug.keystore
          fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Borj_AlJunoon.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: برج الجنون
          files: Borj_AlJunoon.apk
