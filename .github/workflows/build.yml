name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          mkdir -p www
          cp "$(ls game_v*.html | sort -V | tail -1)" www/index.html
      - run: |
          bash "$(ls setup*.sh | sort -V | tail -1)"
      - name: Install fixed signing key
        run: |
          if ls *.keystore >/dev/null 2>&1; then
            mkdir -p ~/.android
            cp "$(ls *.keystore | head -1)" ~/.android/debug.keystore
            echo "Using repo keystore: $(ls *.keystore | head -1)"
          else
            echo "NO KEYSTORE FOUND IN REPO"
            exit 1
          fi
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Borj_AlJunoon.apk
      - name: Show signing fingerprints
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "== keystore =="
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i -E "alias|SHA" || true
          echo "== APK =="
          "$AS" verify --print-certs Borj_AlJunoon.apk | grep -i -E "SHA-256|SHA-1" || true
          FP=$("$AS" verify --print-certs Borj_AlJunoon.apk | grep -m1 "SHA-256" | sed 's/.*: //')
          echo "Signing SHA-256: $FP" > notes.txt
          echo "Game file: $(ls game_v*.html | sort -V | tail -1)" >> notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: برج الجنون
          body_path: notes.txt
          files: Borj_AlJunoon.apk
